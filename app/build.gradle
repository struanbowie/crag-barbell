plugins {
    id 'com.android.application'
}

// Set by the GitHub workflow; each build gets a higher number so Obtainium sees an update
def buildNumber = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.cragbarbell.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cragbarbell.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
