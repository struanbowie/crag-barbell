<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Crag &amp; Barbell Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, sticky tab bar, each superset pair is one grouped panel; tap dots to log sets, weights saved per exercise */
:root {
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --fg: #16212B;
  --muted: #5B6873;
  --line: #DCE2E6;
  --muscle: #C3CCD2;
  --accent: #0B7A75;
  --accent-soft: #DDEFEE;
  --climb: #B5650F;
  --climb-soft: #F7EAD9;
  --stretch: #5A5FB0;
  --stretch-soft: #E7E8F6;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171D; --surface: #18222A; --fg: #E6ECEF; --muted: #9AA7B0; --line: #2A3740; --muscle: #3A4A55;
    --accent: #3FC1BA; --accent-soft: #163A3A; --climb: #F0A24C; --climb-soft: #3A2A17;
    --stretch: #A9ADF0; --stretch-soft: #262A4A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171D; --surface: #18222A; --fg: #E6ECEF; --muted: #9AA7B0; --line: #2A3740; --muscle: #3A4A55;
  --accent: #3FC1BA; --accent-soft: #163A3A; --climb: #F0A24C; --climb-soft: #3A2A17;
  --stretch: #A9ADF0; --stretch-soft: #262A4A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 620px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
}
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 1.6rem;
  margin: 0 0 10px; letter-spacing: .01em; text-wrap: balance;
}
h1 span { color: var(--accent); }
nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
nav button {
  font: 600 .88rem var(--font-display); letter-spacing: .03em; text-transform: uppercase;
  padding: 10px 2px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; min-width: 0;
}
nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

section { display: grid; gap: 14px; padding-top: 16px; }
.intro { color: var(--muted); margin: 0; font-size: .95rem; }
.sub-h { margin: 8px 0 0; font: 800 1.25rem var(--font-display); letter-spacing: .02em; }
.progress {
  display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.block-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.block-head h2 {
  margin: 0; font: 700 1.05rem var(--font-display); text-transform: uppercase; letter-spacing: .06em;
}
.block-head small { color: var(--muted); font-size: .85rem; text-align: right; }
.block.climb .block-head { background: var(--climb-soft); }
.block.climb .block-head h2 { color: var(--climb); }

.ex { padding: 12px 14px; display: grid; gap: 8px; }
.ex + .ex { border-top: 1px solid var(--line); }
.ex-top { display: flex; gap: 10px; align-items: baseline; }
.tag {
  flex: none; font: 700 .8rem var(--font-display); color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 2px 6px; letter-spacing: .04em;
}
.climb .tag { color: var(--climb); background: var(--climb-soft); }
.name { font-weight: 600; min-width: 0; }
.dose {
  margin-left: auto; flex: none; font: 700 1rem var(--font-display);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.info-btn {
  flex: none; align-self: center; width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--muted); background: transparent; color: var(--muted); cursor: pointer;
  font: italic 700 .95rem Georgia, "Times New Roman", serif; line-height: 1;
}
.info-btn[aria-expanded="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.note { color: var(--muted); font-size: .9rem; margin: 0; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dot {
  width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer;
  font: 700 .9rem var(--font-display); font-variant-numeric: tabular-nums;
}
.dot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.climb .dot[aria-pressed="true"] { background: var(--climb); border-color: var(--climb); }

.info { background: var(--bg); border-radius: 10px; padding: 12px; display: grid; gap: 10px; font-size: .93rem; }
.info svg { width: 100%; max-width: 280px; height: auto; justify-self: center; display: block; }
.info .m { fill: var(--muscle); }
.info .m.p { fill: var(--accent); }
.info .m.s { fill: var(--accent); fill-opacity: .4; }
.info .n { fill: var(--line); }
.info text { fill: var(--muted); font: 700 9px var(--font-display); letter-spacing: .08em; }
.works { margin: 0; display: grid; gap: 4px; }
.works span { display: flex; gap: 8px; align-items: baseline; }
.works i {
  flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block;
}
.works i.s { opacity: .4; }
.info ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.info a { color: var(--accent); font-weight: 600; justify-self: start; }

.wt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.wt input {
  width: 88px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--fg); font: 700 1.05rem var(--font-display);
  font-variant-numeric: tabular-nums;
}
.wt .unit { font-size: .9rem; color: var(--muted); }
.wt .was { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.up {
  margin-left: auto; font: 600 .85rem var(--font-body); padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
}
.up[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ex.going-up .wt input { border-color: var(--accent); }

ul.plain { margin: 0; padding: 12px 14px 12px 32px; display: grid; gap: 6px; }
.reset {
  justify-self: start; font: 600 .9rem var(--font-body); padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.reset.confirm { border-color: var(--climb); color: var(--climb); }

.days { display: grid; gap: 8px; }
.day {
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.day b { font: 800 1.1rem var(--font-display); text-transform: uppercase; color: var(--muted); }
.day.gym b { color: var(--accent); }
.day.climbday b { color: var(--climb); }
.day.easy b { color: var(--stretch); }
.day span { min-width: 0; }
.day em { font-style: normal; color: var(--muted); font-size: .9rem; display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h2 { margin: 0 0 8px; font: 700 1.05rem var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.card p { margin: 0; }

.st { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.st .tag { color: var(--stretch); background: var(--stretch-soft); }
.lvl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0; font-size: .93rem; }
.lvl dt {
  font: 700 .75rem var(--font-display); text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding-top: 3px; white-space: nowrap;
}
.lvl dd { margin: 0; min-width: 0; }
.timer, .sw {
  justify-self: start; font: 700 .95rem var(--font-display); letter-spacing: .03em;
  font-variant-numeric: tabular-nums; padding: 9px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--stretch); background: transparent; color: var(--stretch); min-width: 120px;
}
.sw { border-color: var(--accent); color: var(--accent); }
.timer.running { background: var(--stretch); color: var(--bg); }
.sw.running { background: var(--accent); color: var(--bg); }
.timer.finished { background: var(--stretch-soft); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Crag <span>&amp;</span> Barbell</h1>
    <nav role="tablist">
      <button role="tab" id="tab-a" data-view="a">Day A</button>
      <button role="tab" id="tab-b" data-view="b">Day B</button>
      <button role="tab" id="tab-home" data-view="home">At home</button>
      <button role="tab" id="tab-week" data-view="week">Week</button>
      <button role="tab" id="tab-rules" data-view="rules">Rules</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

  ["G3", "Active hang", "2 × 15–20s", 0, "Shoulders pulled down away from your ears the whole time", "s", "activehang"]

  squat: { p: ["quads", "glutes"], s: ["adductors", "lowerback", "abs"], q: "barbell back squat form",
    steps: ["Bar on your upper back, feet shoulder-width, toes turned out slightly.", "Brace your stomach, then sit down between your hips until your thighs are at least level with your knees.", "Keep knees tracking over your toes and your chest up.", "Drive up through the whole foot."] },

function bodySVG(info) {
  const shapes = BODY.map(([m, el, attrs]) => {
    const cls = !m ? "n" : info.p.includes(m) ? "m p" : info.s.includes(m) ? "m s" : "m";
    return `<${el} class="${cls}" ${attrs.replace(/(\w+)=(?!['"])([^\s]+)/g, '$1="$2"').replace(/'/g, '"')}/>`;
  }).join("");
  return `<svg viewBox="0 0 240 200" role="img" aria-label="Muscle map">${shapes}
    <text x="60" y="197" text-anchor="middle">FRONT</text><text x="180" y="197" text-anchor="middle">BACK</text></svg>`;
}

function infoHTML(key, name) {
  const info = INFO[key];
  const list = arr => arr.map(m => MUSCLE_NAMES[m]).join(", ");
  return `${bodySVG(info)}
    <p class="works"><span><i></i><b>Main:</b> ${list(info.p)}</span>${info.s.length ? `<span><i class="s"></i><b>Also:</b> ${list(info.s)}</span>` : ""}</p>
    <ol>${info.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(info.q)}" target="_blank" rel="noopener">Watch a demo on YouTube ↗</a>`;
}

// [name, seconds, per side, start here, progress to]

const WEEK = [
  ["Mon", "Rest + stretch + grip", "Fresh legs and fingers for bouldering", "easy"],

const RULES = [
  ["Effort", ["Finish most sets with 2–3 reps in the tank.", "Weeks 1–2: go lighter than you think."]],
  ["Logging", ["Type the weight (kg) or hold time (seconds) in the box under each exercise. It's saved until you change it.", "When you get 6 reps on every set at that weight (or the top of the rep range), tap ↑ Next time.", "Next session, put the new number in. The box shows what it was before."]],
  ["Progression", ["Go up by the smallest jump: 2.5 kg on barbells, 1–2 kg on dumbbells.", "Holds and hangs: add 5s once every set feels comfortable.", "Climbing block: add 1 rep per set or 1 set every 2 weeks.", "No added weight on the hangboard for the first couple of months.", "Every 6–8 weeks: a lighter week with about half the sets."]],
  ["Protect your climbing", ["No gym the day before a climbing day.", "Home grip work only on non-climbing, non-gym days.", "Heavy climbing week: drop the Day B climbing block.", "Sharp pain in fingers, wrists or elbows means stop. Pump is fine."]],
  ["Swaps", ["No trap bar → deadlift or RDL", "No landmine → single-arm DB press", "No Nordic setup → stability-ball leg curl", "No cables → resistance bands"]]
];

const KEY = "cragbarbell-v1";
const WKEY = "cragbarbell-weights-v1";
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let done = load(KEY);
let weights = load(WKEY);

const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });

function wasText(w, unit) {
  const parts = [];
  if (w.prev != null && w.prev !== "") parts.push(`was ${w.prev}${unit === "s" ? "s" : " kg"} · ${fmtDate(w.date)}`);
  else if (w.date) parts.push(`set ${fmtDate(w.date)}`);
  if (unit === "s" && w.best != null) parts.push(`best ${w.best}s`);
  return parts.join(" · ");
}

function logRow(k, unit) {
  const w = weights[k] || {};
  const secs = unit === "s";
  return `<div class="wt">
    <input id="w-${k}" data-w="${k}" data-unit="${unit}" type="number" inputmode="${secs ? "numeric" : "decimal"}" step="${secs ? 1 : 0.5}" min="0" placeholder="–" value="${w.kg != null ? esc(w.kg) : ""}" aria-label="${secs ? "Hold time in seconds" : "Weight in kg"}">
    <span class="unit">${secs ? "sec" : "kg"}</span><span class="was">${esc(wasText(w, unit))}</span>
    <button class="up" data-up="${k}" aria-pressed="${!!w.up}">↑ Next time</button>
  </div>`;
}

function exHTML(scope, [tag, name, dose, sets, note, unit, info], extra = "") {
  const k = `${scope}-${tag}`;
  let dots = "";
  for (let i = 0; i < sets; i++) {
    const dk = `${k}-${i}`;
    dots += `<button class="dot" data-k="${dk}" aria-pressed="${!!done[dk]}" aria-label="${esc(name)} set ${i + 1}">${i + 1}</button>`;
  }
  const up = unit && weights[k] && weights[k].up;
  return `<div class="ex${up ? " going-up" : ""}">
    <div class="ex-top"><span class="tag">${tag}</span><span class="name">${esc(name)}</span><span class="dose">${dose}</span>
      <button class="info-btn" data-info="${info}" data-name="${esc(name)}" aria-expanded="false" aria-label="How to do ${esc(name)}">i</button></div>
    <div class="info" hidden></div>
    ${note ? `<p class="note">${esc(note)}</p>` : ""}${extra}${unit ? logRow(k, unit) : ""}${sets ? `<div class="dots">${dots}</div>` : ""}</div>`;
}

function renderSession(id) {
  const s = SESSIONS[id];
  let html = `<section><p class="intro">${s.title}. Tap a circle after each set, log what you used, and tap <b>i</b> for how-to and muscles.</p>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span id="count"></span></div>
    <div class="block"><div class="block-head"><h2>Warm-up</h2><small>~10 min</small></div>
    <ul class="plain">${WARMUP.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
  s.blocks.forEach(b => {
    html += `<div class="block${b.climb ? " climb" : ""}"><div class="block-head"><h2>${b.label}</h2><small>${b.sub}</small></div>
      ${b.ex.map(ex => exHTML(id, ex)).join("")}</div>`;
  });
  html += `<button class="reset" id="reset">Clear ticks for this day</button></section>`;
  main.innerHTML = html;
  updateProgress();
  const reset = document.getElementById("reset");
  reset.addEventListener("click", () => {
    if (!reset.classList.contains("confirm")) {
      reset.classList.add("confirm"); reset.textContent = "Tap again to clear (logs stay)";
      setTimeout(() => { reset.classList.remove("confirm"); reset.textContent = "Clear ticks for this day"; }, 3000);
      return;
    }
    Object.keys(done).forEach(k => { if (k.startsWith(id + "-")) delete done[k]; });
    store(KEY, done); renderSession(id);
  });
}

function updateProgress() {
  const bar = document.getElementById("bar"); if (!bar) return;
  const dots = main.querySelectorAll(".dot");
  const n = [...dots].filter(d => d.getAttribute("aria-pressed") === "true").length;
  bar.style.width = (dots.length ? n / dots.length * 100 : 0) + "%";
  document.getElementById("count").textContent = `${n}/${dots.length} sets`;
}

const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function renderHome() {
  main.innerHTML = `<section>
    <h2 class="sub-h">Grip on the pull-up bar</h2>
    <p class="intro">About 5 minutes, light. Do it on Mon, Wed and Sat, not on climbing or gym days. It should feel like 5 out of 10, never a full pump.</p>
    <div class="block"><div class="block-head"><h2>Daily grip</h2><small>~5 min</small></div>
      ${GRIP.map(ex => exHTML("home", ex, ex[6] === "deadhang" ? `<button class="sw" data-sw="home-${ex[0]}">Start hang</button>` : "")).join("")}
    </div>

    <h2 class="sub-h">Stretch routine</h2>
    <p class="intro">About 20 minutes on a yoga mat. Use it on rest days or after a heavy session. Start with the first version of each stretch; the second is where you're heading.</p>
    <div class="card"><h2>How to stretch</h2><ul>
      <li>Aim for a 4–6 out of 10 pull. Never pain.</li>
      <li>Breathe out slowly as you ease in. No bouncing.</li>
      <li>3–4 times a week beats one long session.</li>
      <li>Track one marker, like where your hands reach in the hamstring stretch: thigh, knee, calf, ankle.</li>
    </ul></div>
    ${STRETCHES.map(([name, secs, sides, start, prog], i) => `<div class="st">
      <div class="ex-top"><span class="tag">${i + 1}</span><span class="name">${esc(name)}</span><span class="dose">${fmtTime(secs)}${sides ? " /side" : ""}</span></div>
      <dl class="lvl"><dt>Start here</dt><dd>${esc(start)}</dd><dt>Progress to</dt><dd>${esc(prog)}</dd></dl>
      <button class="timer" data-secs="${secs}">Start ${fmtTime(secs)}</button>
    </div>`).join("")}
  </section>`;
}

let timer = null;
function stopTimer() {
  if (!timer) return;
  clearInterval(timer.id);
  timer.btn.classList.remove("running");
  timer.btn.textContent = `Start ${fmtTime(+timer.btn.dataset.secs)}`;
  timer = null;
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}
function startTimer(btn) {
  const wasThis = timer && timer.btn === btn;
  stopTimer();
  if (wasThis) return;
  let left = +btn.dataset.secs;
  btn.classList.remove("finished"); btn.classList.add("running");
  btn.textContent = `${fmtTime(left)} · tap to stop`;
  timer = { btn, id: setInterval(() => {
    left -= 1;
    if (left > 0) { btn.textContent = `${fmtTime(left)} · tap to stop`; return; }
    clearInterval(timer.id); timer = null;
    btn.classList.remove("running"); btn.classList.add("finished");
    btn.textContent = `Done · again ${fmtTime(+btn.dataset.secs)}`;
    beep();
  }, 1000) };
}

// Stopwatch for hangs: counts up, and logs the time when stopped
let sw = null;
function stopStopwatch(save) {
  if (!sw) return;
  clearInterval(sw.id);
  const secs = Math.round((Date.now() - sw.start) / 1000);
  sw.btn.classList.remove("running");
  sw.btn.textContent = save ? `${secs}s logged · start again` : "Start hang";
  const input = save && sw.btn.closest(".ex").querySelector("input[data-w]");
  sw = null;
  if (input && secs > 0) { input.value = secs; saveLog(input); }
}
function toggleStopwatch(btn) {
  if (sw) { stopStopwatch(sw.btn === btn); return; }
  sw = { btn, start: Date.now(), id: setInterval(() => {
    btn.textContent = `${fmtTime(Math.floor((Date.now() - sw.start) / 1000))} · tap when you drop`;
  }, 250) };
  btn.classList.add("running");
  btn.textContent = "0:00 · tap when you drop";
}

function saveLog(input) {
  const k = input.dataset.w, unit = input.dataset.unit;
  const w = weights[k] || (weights[k] = {});
  const val = input.value.trim();
  if (val === String(w.kg ?? "")) return;
  w.prev = w.kg ?? null;
  w.kg = val === "" ? null : val;
  w.date = new Date().toISOString();
  w.up = false;
  if (unit === "s" && val !== "") w.best = Math.max(+w.best || 0, +val);
  store(WKEY, weights);
  // Update this row in place so focus can move straight to the next box
  const ex = input.closest(".ex");
  ex.classList.remove("going-up");
  ex.querySelector(".up").setAttribute("aria-pressed", "false");
  ex.querySelector(".was").textContent = wasText(w, unit);
}

function renderWeek() {
  main.innerHTML = `<section><p class="intro">Built around bouldering on Tuesday and sport climbing on Thursday.</p>
    <div class="days">${WEEK.map(([d, what, note, kind]) =>
      `<div class="day ${kind}"><b>${d}</b><span>${esc(what)}${note ? `<em>${esc(note)}</em>` : ""}</span></div>`).join("")}</div>
    <div class="card"><h2>Why this order</h2><ul>
      <li>No gym the day before a climb, so your fingers, forearms and lats are fresh on the wall.</li>
      <li>Gym B has the hangboard, so it sits on Sunday with a full rest day before bouldering.</li>
      <li>Gym A is the day after sport climbing. Its main work is legs and pushing, which climbing doesn't tire.</li>
      <li>The swim goes between the two climbs. Keep it easy so it helps recovery.</li>
      <li>Home grip work goes on the three days with no climbing or gym, so your fingers get light work without stacking load.</li>
    </ul></div>
    <div class="card"><h2>Short week?</h2><p>Only one gym day: do Day A on Friday. Feeling beaten up: swap a gym day for the stretch routine and skip the grip work.</p></div></section>`;
}

function renderRules() {
  main.innerHTML = `<section>${RULES.map(([h, items]) =>
    `<div class="card"><h2>${h}</h2><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</section>`;
}

let current = "a";
const VIEWS = ["a", "b", "home", "week", "rules"];
function show(view) {
  if (view === "stretch") view = "home";
  if (!VIEWS.includes(view)) view = "a";
  stopTimer(); stopStopwatch(false);
  current = view;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  if (view === "a" || view === "b") renderSession(view);
  else if (view === "home") renderHome();
  else if (view === "week") renderWeek();
  else renderRules();
  try { localStorage.setItem(KEY + "-tab", view); } catch (e) {}
  window.scrollTo(0, 0);
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) show(b.dataset.view);
});
main.addEventListener("click", e => {
  const d = e.target.closest(".dot");
  if (d) {
    const on = d.getAttribute("aria-pressed") !== "true";
    d.setAttribute("aria-pressed", on);
    if (on) done[d.dataset.k] = 1; else delete done[d.dataset.k];
    store(KEY, done); updateProgress();
    return;
  }
  const ib = e.target.closest(".info-btn");
  if (ib) {
    const panel = ib.closest(".ex").querySelector(".info");
    const open = ib.getAttribute("aria-expanded") !== "true";
    if (open && !panel.innerHTML) panel.innerHTML = infoHTML(ib.dataset.info, ib.dataset.name);
    panel.hidden = !open;
    ib.setAttribute("aria-expanded", open);
    return;
  }
  const u = e.target.closest(".up");
  if (u) {
    const k = u.dataset.up;
    const w = weights[k] || (weights[k] = {});
    w.up = !w.up;
    u.setAttribute("aria-pressed", w.up);
    u.closest(".ex").classList.toggle("going-up", w.up);
    store(WKEY, weights);
    return;
  }
  const s = e.target.closest(".sw");
  if (s) { toggleStopwatch(s); return; }
  const t = e.target.closest(".timer");
  if (t) startTimer(t);
});
main.addEventListener("change", e => {
  const input = e.target.closest("input[data-w]"); if (input) saveLog(input);
});

let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem(KEY + "-tab") || "a"; } catch (e) { start = "a"; } }
show(start);
</script>
