<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Crag &amp; Barbell Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, sticky tab bar, each superset pair is one grouped panel; tap dots to log sets, weights saved per exercise */
:root {
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --fg: #16212B;
  --muted: #5B6873;
  --line: #DCE2E6;
  --accent: #0B7A75;
  --accent-soft: #DDEFEE;
  --climb: #B5650F;
  --climb-soft: #F7EAD9;
  --stretch: #5A5FB0;
  --stretch-soft: #E7E8F6;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171D; --surface: #18222A; --fg: #E6ECEF; --muted: #9AA7B0; --line: #2A3740;
    --accent: #3FC1BA; --accent-soft: #163A3A; --climb: #F0A24C; --climb-soft: #3A2A17;
    --stretch: #A9ADF0; --stretch-soft: #262A4A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171D; --surface: #18222A; --fg: #E6ECEF; --muted: #9AA7B0; --line: #2A3740;
  --accent: #3FC1BA; --accent-soft: #163A3A; --climb: #F0A24C; --climb-soft: #3A2A17;
  --stretch: #A9ADF0; --stretch-soft: #262A4A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 620px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
}
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 1.6rem;
  margin: 0 0 10px; letter-spacing: .01em; text-wrap: balance;
}
h1 span { color: var(--accent); }
nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
nav button {
  font: 600 .88rem var(--font-display); letter-spacing: .03em; text-transform: uppercase;
  padding: 10px 2px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; min-width: 0;
}
nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

section { display: grid; gap: 14px; padding-top: 16px; }
.intro { color: var(--muted); margin: 0; font-size: .95rem; }
.progress {
  display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.block-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.block-head h2 {
  margin: 0; font: 700 1.05rem var(--font-display); text-transform: uppercase; letter-spacing: .06em;
}
.block-head small { color: var(--muted); font-size: .85rem; text-align: right; }
.block.climb .block-head { background: var(--climb-soft); }
.block.climb .block-head h2 { color: var(--climb); }

.ex { padding: 12px 14px; display: grid; gap: 8px; }
.ex + .ex { border-top: 1px solid var(--line); }
.ex-top { display: flex; gap: 10px; align-items: baseline; }
.tag {
  flex: none; font: 700 .8rem var(--font-display); color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 2px 6px; letter-spacing: .04em;
}
.climb .tag { color: var(--climb); background: var(--climb-soft); }
.name { font-weight: 600; min-width: 0; }
.dose {
  margin-left: auto; flex: none; font: 700 1rem var(--font-display);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.note { color: var(--muted); font-size: .9rem; margin: 0; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dot {
  width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer;
  font: 700 .9rem var(--font-display); font-variant-numeric: tabular-nums;
}
.dot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.climb .dot[aria-pressed="true"] { background: var(--climb); border-color: var(--climb); }

.wt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.wt input {
  width: 88px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--fg); font: 700 1.05rem var(--font-display);
  font-variant-numeric: tabular-nums;
}
.wt .unit { font-size: .9rem; color: var(--muted); }
.wt .was { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.up {
  margin-left: auto; font: 600 .85rem var(--font-body); padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
}
.up[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ex.going-up .wt input { border-color: var(--accent); }

ul.plain { margin: 0; padding: 12px 14px 12px 32px; display: grid; gap: 6px; }
.reset {
  justify-self: start; font: 600 .9rem var(--font-body); padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.reset.confirm { border-color: var(--climb); color: var(--climb); }

.days { display: grid; gap: 8px; }
.day {
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.day b { font: 800 1.1rem var(--font-display); text-transform: uppercase; color: var(--muted); }
.day.gym b { color: var(--accent); }
.day.climbday b { color: var(--climb); }
.day.easy b { color: var(--stretch); }
.day span { min-width: 0; }
.day em { font-style: normal; color: var(--muted); font-size: .9rem; display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h2 { margin: 0 0 8px; font: 700 1.05rem var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.card p { margin: 0; }

.st { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.st .tag { color: var(--stretch); background: var(--stretch-soft); }
.lvl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0; font-size: .93rem; }
.lvl dt {
  font: 700 .75rem var(--font-display); text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding-top: 3px; white-space: nowrap;
}
.lvl dd { margin: 0; min-width: 0; }
.timer {
  justify-self: start; font: 700 .95rem var(--font-display); letter-spacing: .03em;
  font-variant-numeric: tabular-nums; padding: 9px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--stretch); background: transparent; color: var(--stretch); min-width: 120px;
}
.timer.running { background: var(--stretch); color: var(--bg); }
.timer.finished { background: var(--stretch-soft); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Crag <span>&amp;</span> Barbell</h1>
    <nav role="tablist">
      <button role="tab" id="tab-a" data-view="a">Day A</button>
      <button role="tab" id="tab-b" data-view="b">Day B</button>
      <button role="tab" id="tab-stretch" data-view="stretch">Stretch</button>
      <button role="tab" id="tab-week" data-view="week">Week</button>
      <button role="tab" id="tab-rules" data-view="rules">Rules</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
const WARMUP = [
  "5 min rower, bike or skipping rope",
  "Band pull-aparts ×15 · band dislocates ×10",
  "Glute bridges ×10 · bodyweight squats ×10 · leg swings ×10 per side",
  "Scap pull-ups ×5 · 15s dead hang",
  "1–2 light sets of your first lift"
];

// [tag, name, dose, sets, note, tracks weight]
const SESSIONS = {
  a: {
    title: "Squat · Push · Lat endurance",
    blocks: [
      { label: "Superset A", sub: "60s between · 90s after pair", ex: [
        ["A1", "Back squat (or goblet squat)", "4 × 5–6", 4, "Main leg lift", true],
        ["A2", "Dumbbell bench press", "4 × 8", 4, "Balances climbing's pulling", true]]},
      { label: "Superset B", sub: "60s between · 90s after pair", ex: [
        ["B1", "Romanian deadlift", "3 × 8", 3, "Slow on the way down", true],
        ["B2", "Chest-supported / cable row", "3 × 10", 3, "Moderate weight, posture", true]]},
      { label: "Superset C", sub: "60s between · 90s after pair", ex: [
        ["C1", "Bulgarian split squat", "3 × 8/leg", 3, "Single-leg strength and balance", true],
        ["C2", "Half-kneeling landmine press", "3 × 8/arm", 3, "Or single-arm DB overhead press", true]]},
      { label: "Circuit D", sub: "2 rounds", ex: [
        ["D1", "DB external rotations", "12–15", 2, "Shoulder prehab", true],
        ["D2", "Pallof press", "10/side", 2, "Anti-rotation core", true],
        ["D3", "Reverse wrist curls", "15", 2, "Elbow prehab", true]]},
      { label: "Climbing block", climb: true, sub: "Never to failure", ex: [
        ["E1", "Pull-ups, submax", "4 × 50–60%", 4, "Max 12 → sets of 6–7, 60s rest. Or lat pulldown 3 × 15–20", false],
        ["E2", "Lock-off holds", "2 rounds", 2, "5–10s each at top, 90°, 120°", false],
        ["E3", "Scapular pull-ups", "2 × 8", 2, "Straight arms, shoulder blades only", false]]}
    ]
  },
  b: {
    title: "Hinge · Overhead · Forearm endurance",
    blocks: [
      { label: "Superset A", sub: "60s between · 90s after pair", ex: [
        ["A1", "Trap bar deadlift", "4 × 5", 4, "Or regular deadlift", true],
        ["A2", "Standing overhead press", "4 × 6", 4, "Barbell, brace hard", true]]},
      { label: "Superset B", sub: "60s between · 90s after pair", ex: [
        ["B1", "Dips (or push-ups)", "3 × 8–12", 3, "Log added weight once bodyweight is easy", true],
        ["B2", "Walking lunges / step-ups", "3 × 10/leg", 3, "", true]]},
      { label: "Superset C", sub: "60s between · 90s after pair", ex: [
        ["C1", "Nordic hamstring curl", "3 × 4–6", 3, "Or lying leg curl", false],
        ["C2", "Face pulls", "3 × 15", 3, "Light, shoulder health", true]]},
      { label: "Circuit D", sub: "2 rounds", ex: [
        ["D1", "Copenhagen plank", "20–30s/side", 2, "Groin", false],
        ["D2", "Ab wheel rollout", "8–10", 2, "Core", false],
        ["D3", "Single-leg calf raise", "12/leg", 2, "Calves and Achilles", true]]},
      { label: "Climbing block", climb: true, sub: "Hard, not failing", ex: [
        ["E1", "Hangboard repeaters", "3–5 sets", 5, "7s on / 3s off ×6 per set, 3 min rest. 20 mm+ edge, open hand or half-crimp, feet on box if needed. No board: dead hangs 20s on/10s off ×5, or farmer's carries 3 × 40–60s", false],
        ["E2", "Band finger extensions", "2 × 20", 2, "Don't skip", false],
        ["E3", "Reverse wrist curls", "2 × 15", 2, "Elbow protection", true]]}
    ]
  }
};

// [name, seconds, per side, start here, progress to]
const STRETCHES = [
  ["Cat–cow", 60, false,
    "On hands and knees, slowly round your back up, then let your belly drop. Move only as far as feels easy.",
    "Slower and bigger, pausing 2s at each end."],
  ["Child's pose", 90, false,
    "Knees wide, sit back toward your heels and reach your arms forward. If your hips stay high, rest your forehead on stacked fists.",
    "Hips sink lower. Walk your hands to one side, then the other, to stretch the lats."],
  ["Lying hamstring stretch", 60, true,
    "On your back with one foot flat on the mat. Lift the other leg and hold behind the thigh with the knee bent. Slowly straighten the knee until you feel a stretch, and stop there.",
    "Straighter knee, then hold the calf, then the ankle."],
  ["Half-kneeling hip flexor", 60, true,
    "One knee down on folded mat, other foot in front. Squeeze the glute of the kneeling leg and shift your hips forward a few centimetres.",
    "Raise the arm on the kneeling side and lean slightly away. Later, rest the back foot on a sofa (couch stretch)."],
  ["Figure-4 glute stretch", 60, true,
    "On your back with both feet on the floor. Cross one ankle over the other knee. If that's already a stretch, stay there.",
    "Lift the bottom foot and pull that thigh toward your chest. Later, try pigeon pose."],
  ["Adductor rock-backs", 60, true,
    "On hands and knees, straighten one leg out to the side, foot flat. Rock your hips slowly back and forward through a small range.",
    "Wider leg, rock further back, hold the end for 5s. Helps high steps and frog positions on the wall."],
  ["90/90 hip switches", 90, false,
    "Sit with both knees bent, one leg in front and one to the side. Lean back on your hands and slowly tip both knees from side to side.",
    "Hands off the floor and sit tall. Then lean forward over the front shin."],
  ["Supported deep squat", 60, false,
    "Hold a door frame or a heavy table and sit down into a squat as low as is comfortable. Heels can lift. Sit on a cushion if you need to.",
    "Heels down, then let go and use your elbows to push your knees out."],
  ["Thread the needle", 45, true,
    "On hands and knees, slide one arm under your body along the mat and let that shoulder and ear sink down.",
    "Reach further under, then sweep that arm up to the ceiling between holds."],
  ["Forearm stretch", 60, false,
    "Kneel with palms on the mat, fingers pointing back toward your knees, elbows straight. Lean back only slightly. After 30s, flip to the backs of your hands.",
    "Lean further back while keeping your palms flat."],
  ["Bent-knee downward dog", 60, false,
    "Hands and feet on the mat, hips high, knees well bent. Pedal your feet, pressing one heel down then the other.",
    "Straighter legs, heels closer to the floor."],
  ["Lying twist", 60, true,
    "On your back, pull one knee across your body with the other arm out wide. Let the knee hover if it doesn't reach the floor. Breathe slowly.",
    "Knee rests on the floor while both shoulders stay flat."]
];

const WEEK = [
  ["Mon", "Rest + stretch", "Fresh legs and fingers for bouldering", "easy"],
  ["Tue", "Bouldering", "Optional 4x4s at the end", "climbday"],
  ["Wed", "Easy swim", "20–30 min. Recovery between climbs", "easy"],
  ["Thu", "Sport climbing", "Laps or ARC for endurance", "climbday"],
  ["Fri", "Gym A", "Squat, push, lat endurance. Nothing to climb tomorrow", "gym"],
  ["Sat", "Rest + stretch", "Or a second easy swim", "easy"],
  ["Sun", "Gym B", "Hangboard is 48h before bouldering", "gym"]
];

const RULES = [
  ["Effort", ["Finish most sets with 2–3 reps in the tank.", "Weeks 1–2: go lighter than you think."]],
  ["Logging weights", ["Type the weight you used in the box under each lift. It's saved until you change it.", "When you get 6 reps on every set at that weight (or the top of the rep range), tap ↑ Next time.", "Next session, put the new weight in. The box shows what it was before."]],
  ["Progression", ["Go up by the smallest jump: 2.5 kg on barbells, 1–2 kg on dumbbells.", "Climbing block: add 1 rep per set or 1 set every 2 weeks.", "No added weight on the hangboard for the first couple of months.", "Every 6–8 weeks: a lighter week with about half the sets."]],
  ["Protect your climbing", ["No gym the day before a climbing day.", "Heavy climbing week: drop the Day B climbing block.", "Sharp pain in fingers, wrists or elbows means stop. Pump is fine."]],
  ["Swaps", ["No trap bar → deadlift or RDL", "No landmine → single-arm DB press", "No Nordic setup → stability-ball leg curl", "No cables → resistance bands"]]
];

const KEY = "cragbarbell-v1";
const WKEY = "cragbarbell-weights-v1";
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let done = load(KEY);
let weights = load(WKEY);

const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });

function weightRow(id, tag) {
  const k = `${id}-${tag}`;
  const w = weights[k] || {};
  const was = w.prev != null && w.prev !== "" ? `was ${esc(w.prev)} kg · ${fmtDate(w.date)}`
    : w.date ? `set ${fmtDate(w.date)}` : "";
  return `<div class="wt">
    <input id="w-${k}" data-w="${k}" type="number" inputmode="decimal" step="0.5" min="0" placeholder="–" value="${w.kg != null ? esc(w.kg) : ""}" aria-label="Weight in kg">
    <span class="unit">kg</span><span class="was">${was}</span>
    <button class="up" data-up="${k}" aria-pressed="${!!w.up}">↑ Next time</button>
  </div>`;
}

function renderSession(id) {
  const s = SESSIONS[id];
  let html = `<section><p class="intro">${s.title}. Tap a circle after each set and log the weight you used.</p>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span id="count"></span></div>
    <div class="block"><div class="block-head"><h2>Warm-up</h2><small>~10 min</small></div>
    <ul class="plain">${WARMUP.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
  s.blocks.forEach(b => {
    html += `<div class="block${b.climb ? " climb" : ""}"><div class="block-head"><h2>${b.label}</h2><small>${b.sub}</small></div>`;
    b.ex.forEach(([tag, name, dose, sets, note, tracked]) => {
      let dots = "";
      for (let i = 0; i < sets; i++) {
        const k = `${id}-${tag}-${i}`;
        dots += `<button class="dot" data-k="${k}" aria-pressed="${!!done[k]}" aria-label="${esc(name)} set ${i + 1}">${i + 1}</button>`;
      }
      const up = tracked && weights[`${id}-${tag}`] && weights[`${id}-${tag}`].up;
      html += `<div class="ex${up ? " going-up" : ""}"><div class="ex-top"><span class="tag">${tag}</span><span class="name">${esc(name)}</span><span class="dose">${dose}</span></div>
        ${note ? `<p class="note">${esc(note)}</p>` : ""}${tracked ? weightRow(id, tag) : ""}<div class="dots">${dots}</div></div>`;
    });
    html += `</div>`;
  });
  html += `<button class="reset" id="reset">Clear ticks for this day</button></section>`;
  main.innerHTML = html;
  updateProgress();
  const reset = document.getElementById("reset");
  reset.addEventListener("click", () => {
    if (!reset.classList.contains("confirm")) {
      reset.classList.add("confirm"); reset.textContent = "Tap again to clear (weights stay)";
      setTimeout(() => { reset.classList.remove("confirm"); reset.textContent = "Clear ticks for this day"; }, 3000);
      return;
    }
    Object.keys(done).forEach(k => { if (k.startsWith(id + "-")) delete done[k]; });
    store(KEY, done); renderSession(id);
  });
}

function updateProgress() {
  const dots = main.querySelectorAll(".dot");
  const n = [...dots].filter(d => d.getAttribute("aria-pressed") === "true").length;
  document.getElementById("bar").style.width = (dots.length ? n / dots.length * 100 : 0) + "%";
  document.getElementById("count").textContent = `${n}/${dots.length} sets`;
}

const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function renderStretch() {
  main.innerHTML = `<section><p class="intro">About 20 minutes on a yoga mat. Use it on rest days or after a heavy session. Start with the first version of each stretch; the second is where you're heading.</p>
    <div class="card"><h2>How to stretch</h2><ul>
      <li>Aim for a 4–6 out of 10 pull. Never pain.</li>
      <li>Breathe out slowly as you ease in. No bouncing.</li>
      <li>3–4 times a week beats one long session.</li>
      <li>Track one marker, like where your hands reach in the hamstring stretch: thigh, knee, calf, ankle.</li>
    </ul></div>
    ${STRETCHES.map(([name, secs, sides, start, prog], i) => `<div class="st">
      <div class="ex-top"><span class="tag">${i + 1}</span><span class="name">${esc(name)}</span><span class="dose">${fmtTime(secs)}${sides ? " /side" : ""}</span></div>
      <dl class="lvl"><dt>Start here</dt><dd>${esc(start)}</dd><dt>Progress to</dt><dd>${esc(prog)}</dd></dl>
      <button class="timer" data-secs="${secs}">Start ${fmtTime(secs)}</button>
    </div>`).join("")}
  </section>`;
}

let timer = null;
function stopTimer() {
  if (!timer) return;
  clearInterval(timer.id);
  timer.btn.classList.remove("running");
  timer.btn.textContent = `Start ${fmtTime(+timer.btn.dataset.secs)}`;
  timer = null;
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}
function startTimer(btn) {
  const wasThis = timer && timer.btn === btn;
  stopTimer();
  if (wasThis) return;
  let left = +btn.dataset.secs;
  btn.classList.remove("finished"); btn.classList.add("running");
  btn.textContent = `${fmtTime(left)} · tap to stop`;
  timer = { btn, id: setInterval(() => {
    left -= 1;
    if (left > 0) { btn.textContent = `${fmtTime(left)} · tap to stop`; return; }
    clearInterval(timer.id); timer = null;
    btn.classList.remove("running"); btn.classList.add("finished");
    btn.textContent = `Done · again ${fmtTime(+btn.dataset.secs)}`;
    beep();
  }, 1000) };
}

function renderWeek() {
  main.innerHTML = `<section><p class="intro">Built around bouldering on Tuesday and sport climbing on Thursday.</p>
    <div class="days">${WEEK.map(([d, what, note, kind]) =>
      `<div class="day ${kind}"><b>${d}</b><span>${esc(what)}${note ? `<em>${esc(note)}</em>` : ""}</span></div>`).join("")}</div>
    <div class="card"><h2>Why this order</h2><ul>
      <li>No gym the day before a climb, so your fingers, forearms and lats are fresh on the wall.</li>
      <li>Gym B has the hangboard, so it sits on Sunday with a full rest day before bouldering.</li>
      <li>Gym A is the day after sport climbing. Its main work is legs and pushing, which climbing doesn't tire.</li>
      <li>The swim goes between the two climbs. Keep it easy so it helps recovery.</li>
    </ul></div>
    <div class="card"><h2>Short week?</h2><p>Only one gym day: do Day A on Friday. Feeling beaten up: swap a gym day for the stretch routine.</p></div></section>`;
}

function renderRules() {
  main.innerHTML = `<section>${RULES.map(([h, items]) =>
    `<div class="card"><h2>${h}</h2><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</section>`;
}

let current = "a";
const VIEWS = ["a", "b", "stretch", "week", "rules"];
function show(view) {
  if (!VIEWS.includes(view)) view = "a";
  stopTimer();
  current = view;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  if (view === "a" || view === "b") renderSession(view);
  else if (view === "stretch") renderStretch();
  else if (view === "week") renderWeek();
  else renderRules();
  try { localStorage.setItem(KEY + "-tab", view); } catch (e) {}
  window.scrollTo(0, 0);
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) show(b.dataset.view);
});
main.addEventListener("click", e => {
  const d = e.target.closest(".dot");
  if (d) {
    const on = d.getAttribute("aria-pressed") !== "true";
    d.setAttribute("aria-pressed", on);
    if (on) done[d.dataset.k] = 1; else delete done[d.dataset.k];
    store(KEY, done); updateProgress();
    return;
  }
  const u = e.target.closest(".up");
  if (u) {
    const k = u.dataset.up;
    const w = weights[k] || (weights[k] = {});
    w.up = !w.up;
    u.setAttribute("aria-pressed", w.up);
    u.closest(".ex").classList.toggle("going-up", w.up);
    store(WKEY, weights);
    return;
  }
  const t = e.target.closest(".timer");
  if (t) startTimer(t);
});
main.addEventListener("change", e => {
  const input = e.target.closest("input[data-w]"); if (!input) return;
  const k = input.dataset.w;
  const w = weights[k] || (weights[k] = {});
  const val = input.value.trim();
  if (val === String(w.kg ?? "")) return;
  w.prev = w.kg ?? null;
  w.kg = val === "" ? null : val;
  w.date = new Date().toISOString();
  w.up = false;
  store(WKEY, weights);
  // Update this row in place so focus can move straight to the next box
  const ex = input.closest(".ex");
  ex.classList.remove("going-up");
  ex.querySelector(".up").setAttribute("aria-pressed", "false");
  ex.querySelector(".was").textContent = w.prev != null && w.prev !== ""
    ? `was ${w.prev} kg · ${fmtDate(w.date)}` : `set ${fmtDate(w.date)}`;
});

let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem(KEY + "-tab") || "a"; } catch (e) { start = "a"; } }
show(start);
</script>
