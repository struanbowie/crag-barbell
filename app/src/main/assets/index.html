<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Crag &amp; Barbell Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, sticky tab bar, each superset pair is one grouped panel; tap dots to log sets */
:root {
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --fg: #16212B;
  --muted: #5B6873;
  --line: #DCE2E6;
  --accent: #0B7A75;
  --accent-soft: #DDEFEE;
  --climb: #B5650F;
  --climb-soft: #F7EAD9;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171D; --surface: #18222A; --fg: #E6ECEF; --muted: #9AA7B0; --line: #2A3740;
    --accent: #3FC1BA; --accent-soft: #163A3A; --climb: #F0A24C; --climb-soft: #3A2A17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171D; --surface: #18222A; --fg: #E6ECEF; --muted: #9AA7B0; --line: #2A3740;
  --accent: #3FC1BA; --accent-soft: #163A3A; --climb: #F0A24C; --climb-soft: #3A2A17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 620px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
}
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 1.6rem;
  margin: 0 0 10px; letter-spacing: .01em; text-wrap: balance;
}
h1 span { color: var(--accent); }
nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
nav button {
  font: 600 .95rem var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  padding: 10px 4px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer;
}
nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button:focus-visible, .dot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

section { display: grid; gap: 14px; padding-top: 16px; }
.intro { color: var(--muted); margin: 0; font-size: .95rem; }
.progress {
  display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.block-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.block-head h2 {
  margin: 0; font: 700 1.05rem var(--font-display); text-transform: uppercase; letter-spacing: .06em;
}
.block-head small { color: var(--muted); font-size: .85rem; text-align: right; }
.block.climb .block-head { background: var(--climb-soft); }
.block.climb .block-head h2 { color: var(--climb); }

.ex { padding: 12px 14px; display: grid; gap: 6px; }
.ex + .ex { border-top: 1px solid var(--line); }
.ex-top { display: flex; gap: 10px; align-items: baseline; }
.tag {
  flex: none; font: 700 .8rem var(--font-display); color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 2px 6px; letter-spacing: .04em;
}
.climb .tag { color: var(--climb); background: var(--climb-soft); }
.name { font-weight: 600; min-width: 0; }
.dose {
  margin-left: auto; flex: none; font: 700 1rem var(--font-display);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.note { color: var(--muted); font-size: .9rem; margin: 0; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 2px; }
.dot {
  width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer;
  font: 700 .9rem var(--font-display); font-variant-numeric: tabular-nums;
}
.dot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.climb .dot[aria-pressed="true"] { background: var(--climb); border-color: var(--climb); }

ul.plain { margin: 0; padding: 12px 14px 12px 32px; display: grid; gap: 6px; }
.reset {
  justify-self: start; font: 600 .9rem var(--font-body); padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.reset.confirm { border-color: var(--climb); color: var(--climb); }

.days { display: grid; gap: 8px; }
.day {
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.day b { font: 800 1.1rem var(--font-display); text-transform: uppercase; color: var(--muted); }
.day.gym b { color: var(--accent); }
.day span { min-width: 0; }
.day em { font-style: normal; color: var(--muted); font-size: .9rem; display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h2 { margin: 0 0 8px; font: 700 1.05rem var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.card p { margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Crag <span>&amp;</span> Barbell</h1>
    <nav role="tablist">
      <button role="tab" id="tab-a" data-view="a">Day A</button>
      <button role="tab" id="tab-b" data-view="b">Day B</button>
      <button role="tab" id="tab-week" data-view="week">Week</button>
      <button role="tab" id="tab-rules" data-view="rules">Rules</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
const WARMUP = [
  "5 min rower, bike or skipping rope",
  "Band pull-aparts ×15 · band dislocates ×10",
  "Glute bridges ×10 · bodyweight squats ×10 · leg swings ×10 per side",
  "Scap pull-ups ×5 · 15s dead hang",
  "1–2 light sets of your first lift"
];

const SESSIONS = {
  a: {
    title: "Squat · Push · Lat endurance",
    blocks: [
      { label: "Superset A", sub: "60s between · 90s after pair", ex: [
        ["A1", "Back squat (or goblet squat)", "4 × 5–6", 4, "Main leg lift"],
        ["A2", "Dumbbell bench press", "4 × 8", 4, "Balances climbing's pulling"]]},
      { label: "Superset B", sub: "60s between · 90s after pair", ex: [
        ["B1", "Romanian deadlift", "3 × 8", 3, "Slow on the way down"],
        ["B2", "Chest-supported / cable row", "3 × 10", 3, "Moderate weight, posture"]]},
      { label: "Superset C", sub: "60s between · 90s after pair", ex: [
        ["C1", "Bulgarian split squat", "3 × 8/leg", 3, "Single-leg strength for football"],
        ["C2", "Half-kneeling landmine press", "3 × 8/arm", 3, "Or single-arm DB overhead press"]]},
      { label: "Circuit D", sub: "2 rounds", ex: [
        ["D1", "DB external rotations", "12–15", 2, "Shoulder prehab"],
        ["D2", "Pallof press", "10/side", 2, "Anti-rotation core"],
        ["D3", "Reverse wrist curls", "15", 2, "Elbow prehab"]]},
      { label: "Climbing block", climb: true, sub: "Never to failure", ex: [
        ["E1", "Pull-ups, submax", "4 × 50–60%", 4, "Max 12 → sets of 6–7, 60s rest. Or lat pulldown 3 × 15–20"],
        ["E2", "Lock-off holds", "2 rounds", 2, "5–10s each at top, 90°, 120°"],
        ["E3", "Scapular pull-ups", "2 × 8", 2, "Straight arms, shoulder blades only"]]}
    ]
  },
  b: {
    title: "Hinge · Overhead · Forearm endurance",
    blocks: [
      { label: "Superset A", sub: "60s between · 90s after pair", ex: [
        ["A1", "Trap bar deadlift", "4 × 5", 4, "Or regular deadlift"],
        ["A2", "Standing overhead press", "4 × 6", 4, "Barbell, brace hard"]]},
      { label: "Superset B", sub: "60s between · 90s after pair", ex: [
        ["B1", "Dips (or push-ups)", "3 × 8–12", 3, "Add weight when easy"],
        ["B2", "Walking lunges / step-ups", "3 × 10/leg", 3, ""]]},
      { label: "Superset C", sub: "60s between · 90s after pair", ex: [
        ["C1", "Nordic hamstring curl", "3 × 4–6", 3, "Or lying leg curl"],
        ["C2", "Face pulls", "3 × 15", 3, "Light, shoulder health"]]},
      { label: "Circuit D", sub: "2 rounds", ex: [
        ["D1", "Copenhagen plank", "20–30s/side", 2, "Groin"],
        ["D2", "Ab wheel rollout", "8–10", 2, "Core"],
        ["D3", "Single-leg calf raise", "12/leg", 2, "Calves and Achilles"]]},
      { label: "Climbing block", climb: true, sub: "Hard, not failing", ex: [
        ["E1", "Hangboard repeaters", "3–5 sets", 5, "7s on / 3s off ×6 per set, 3 min rest. 20 mm+ edge, open hand or half-crimp, feet on box if needed. No board: dead hangs 20s on/10s off ×5, or farmer's carries 3 × 40–60s"],
        ["E2", "Band finger extensions", "2 × 20", 2, "Don't skip"],
        ["E3", "Reverse wrist curls", "2 × 15", 2, "Elbow protection"]]}
    ]
  }
};

const WEEK = [
  ["Mon", "Gym A", "Squat, push, lat endurance", true],
  ["Tue", "Climb", "Add ARC: 2–3 × 10–20 min easy, mild pump", false],
  ["Wed", "Swim or rest", "Easy recovery", false],
  ["Thu", "Gym B", "Hinge, overhead, forearm endurance", true],
  ["Fri", "Rest", "", false],
  ["Sat", "Football", "Keep 48h from heavy leg days", false],
  ["Sun", "Climb", "Optional 4x4s: 4 problems back to back, 3–4 min rest, ×4", false]
];

const RULES = [
  ["Effort", ["Finish most sets with 2–3 reps in the tank.", "Weeks 1–2: go lighter than you think."]],
  ["Progression", ["Main lifts: hit the top of the rep range on every set, then add a little weight.", "Climbing block: add 1 rep per set or 1 set every 2 weeks.", "No added weight on the hangboard for the first couple of months.", "Every 6–8 weeks: a lighter week with about half the sets."]],
  ["Protect your climbing", ["Hangboard counts as climbing: not the day before a hard session.", "Heavy climbing week: drop the Day B climbing block.", "Sharp pain in fingers, wrists or elbows means stop. Pump is fine."]],
  ["Swaps", ["No trap bar → deadlift or RDL", "No landmine → single-arm DB press", "No Nordic setup → stability-ball leg curl", "No cables → resistance bands"]]
];

const KEY = "cragbarbell-v1";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

const main = document.getElementById("main");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderSession(id) {
  const s = SESSIONS[id];
  let html = `<section><p class="intro">${s.title}. Tap a circle after each set.</p>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span id="count"></span></div>
    <div class="block"><div class="block-head"><h2>Warm-up</h2><small>~10 min</small></div>
    <ul class="plain">${WARMUP.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
  s.blocks.forEach(b => {
    html += `<div class="block${b.climb ? " climb" : ""}"><div class="block-head"><h2>${b.label}</h2><small>${b.sub}</small></div>`;
    b.ex.forEach(([tag, name, dose, sets, note]) => {
      let dots = "";
      for (let i = 0; i < sets; i++) {
        const k = `${id}-${tag}-${i}`;
        dots += `<button class="dot" data-k="${k}" aria-pressed="${!!done[k]}" aria-label="${esc(name)} set ${i + 1}">${i + 1}</button>`;
      }
      html += `<div class="ex"><div class="ex-top"><span class="tag">${tag}</span><span class="name">${esc(name)}</span><span class="dose">${dose}</span></div>
        ${note ? `<p class="note">${esc(note)}</p>` : ""}<div class="dots">${dots}</div></div>`;
    });
    html += `</div>`;
  });
  html += `<button class="reset" id="reset">Clear ticks for this day</button></section>`;
  main.innerHTML = html;
  updateProgress(id);
  const reset = document.getElementById("reset");
  reset.addEventListener("click", () => {
    if (!reset.classList.contains("confirm")) {
      reset.classList.add("confirm"); reset.textContent = "Tap again to clear";
      setTimeout(() => { reset.classList.remove("confirm"); reset.textContent = "Clear ticks for this day"; }, 3000);
      return;
    }
    Object.keys(done).forEach(k => { if (k.startsWith(id + "-")) delete done[k]; });
    save(); renderSession(id);
  });
}

function updateProgress(id) {
  const dots = main.querySelectorAll(".dot");
  const n = [...dots].filter(d => d.getAttribute("aria-pressed") === "true").length;
  document.getElementById("bar").style.width = (dots.length ? n / dots.length * 100 : 0) + "%";
  document.getElementById("count").textContent = `${n}/${dots.length} sets`;
}

function renderWeek() {
  main.innerHTML = `<section><p class="intro">Example week. Shuffle days to fit, keeping heavy legs 48h from football.</p>
    <div class="days">${WEEK.map(([d, what, note, gym]) =>
      `<div class="day${gym ? " gym" : ""}"><b>${d}</b><span>${esc(what)}${note ? `<em>${esc(note)}</em>` : ""}</span></div>`).join("")}</div>
    <div class="card"><h2>Short week?</h2><p>4 days: swap a climb or swim for a repeat of Day A. 2 days: one gym session plus climbing.</p></div></section>`;
}

function renderRules() {
  main.innerHTML = `<section>${RULES.map(([h, items]) =>
    `<div class="card"><h2>${h}</h2><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</section>`;
}

let current = "a";
function show(view) {
  if (!["a", "b", "week", "rules"].includes(view)) view = "a";
  current = view;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  if (view === "a" || view === "b") renderSession(view);
  else if (view === "week") renderWeek();
  else renderRules();
  try { localStorage.setItem(KEY + "-tab", view); } catch (e) {}
  window.scrollTo(0, 0);
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) show(b.dataset.view);
});
main.addEventListener("click", e => {
  const d = e.target.closest(".dot"); if (!d) return;
  const on = d.getAttribute("aria-pressed") !== "true";
  d.setAttribute("aria-pressed", on);
  if (on) done[d.dataset.k] = 1; else delete done[d.dataset.k];
  save(); updateProgress(current);
});

let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem(KEY + "-tab") || "a"; } catch (e) { start = "a"; } }
show(start);
</script>

</body>
</html>
